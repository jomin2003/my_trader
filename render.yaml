# =====================================================================
# Render infrastructure-as-code for the FREE TIER trading bot
# =====================================================================
services:
  - type: web
    name: trading-bot
    runtime: python
    plan: free                            # $0/month - 512 MB RAM, 0.1 CPU
    region: singapore                     # closest to India
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 900
    healthCheckPath: /healthz             # Render also pings this (belt+braces)
    envVars:
      # ---- SECRETS (set in Render dashboard, NOT here) ----
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: DHAN_PIN
        sync: false
      - key: DHAN_TOTP_SECRET
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
      - key: CRON_SECRET
        sync: false                       # any random string; also on cron-job.org
      - key: GITHUB_TOKEN
        sync: false                       # PAT with gist scope
      - key: GITHUB_GIST_ID
        sync: false
      # ---- STATIC ----
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TZ
        value: Asia/Kolkata
