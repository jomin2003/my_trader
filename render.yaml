# =====================================================================
# Render infrastructure-as-code for the trading orchestrator.
# Commit this file to your repo; Render auto-detects & provisions.
# =====================================================================
services:
  - type: worker                          # Background Worker (not Web Service)
    name: trading-orchestrator
    runtime: python
    plan: starter                         # $7/mo — REQUIRED for 24/7
    region: singapore                     # closest to India (low Dhan API latency)
    branch: main
    autoDeploy: true                      # redeploy on git push
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python scheduler.py
    # Auto-restart on crash — Render does this by default, but be explicit
    healthCheckPath: ""                   # workers have no HTTP health check
    disk:
      name: trading-data                  # persistent 1GB disk
      mountPath: /opt/render/project/src/data
      sizeGB: 1                           # ~$0.25/mo — holds CSVs + configs
    envVars:
      # ------- REQUIRED: set these in Render dashboard, NOT here -------
      - key: DHAN_CLIENT_ID
        sync: false                       # 'sync: false' = enter in dashboard
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
      # ------- Optional: overrides -------
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: REPO_DIR
        value: /opt/render/project/src
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TZ
        value: Asia/Kolkata
