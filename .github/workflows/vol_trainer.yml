name: vol-trainer-nightly

# Tier-2 volatility forecaster — trains after NSE close and publishes
# vol_forecast.json to a Gist that the live scanner's vol_gate.py reads.
#
# Mirrors the Kronos nightly job. CPU-only, free-tier friendly.

on:
  schedule:
    # NSE closes 15:30 IST. Run ~16:15 IST = 10:45 UTC, weekdays only.
    - cron: "45 10 * * 1-5"
  workflow_dispatch: {}          # allow manual "Run workflow" from the UI

concurrency:
  group: vol-trainer
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-vol.txt

      - name: Download fresh daily bars (yfinance, no auth needed)
        run: |
          python csv_downloader.py --mode yfinance --preset nifty50 --out ./data
        # If you prefer Dhan bars instead, swap the line above for:
        #   python csv_downloader.py --mode dhan --preset nifty50 --out ./data
        # and add DHAN_CLIENT_ID / DHAN_ACCESS_TOKEN to env below.

      - name: Train volatility model + publish forecast
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          VOL_GIST_ID: ${{ secrets.VOL_GIST_ID }}
        run: |
          python vol_trainer.py --csv-dir ./data --out ./vol_forecast.json

      - name: Upload forecast as build artifact (debug/audit)
        uses: actions/upload-artifact@v4
        with:
          name: vol_forecast
          path: vol_forecast.json
          retention-days: 7
